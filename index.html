    <!--
      Critérios para o Chrome Android mostrar o prompt de instalação (qualquer versão):
      1. ✅ manifest.json válido com name, icons (192px any + 512px maskable), start_url, display
      2. ✅ Service Worker registrado com fetch handler
      3. ✅ HTTPS
      4. ✅ Ícones servidos sem erro
      5. ✅ Chrome >= 119: screenshots recomendadas (adicionadas ao manifest)
      6. ✅ prefer_related_applications: false (ou ausente)
    -->
    <script>
      (function() {
        var path = window.location.pathname;
        var isSindicato = path.startsWith('/app') || path.startsWith('/sindicato');
        var iconLinks = document.querySelectorAll('link[rel="icon"], link[rel="shortcut icon"], link[rel="apple-touch-icon"]');
        for (var i = 0; i < iconLinks.length; i++) {
          iconLinks[i].parentNode && iconLinks[i].parentNode.removeChild(iconLinks[i]);
        }
        
        if (isSindicato) {
          // --- SECMI / Sindicato branding ---
          var manifest = document.querySelector('link[rel="manifest"]');
          if (manifest) manifest.href = '/manifest-sindicato.webmanifest?v=sindicato-20260517c';

          // Favicon sindicato
          var favicon = document.createElement('link');
          favicon.rel = 'icon';
          favicon.type = 'image/png';
          favicon.href = '/apple-touch-icon-sindicato.png';
          document.head.appendChild(favicon);
          
          // Apple touch icon sindicato
          var appleIcon = document.createElement('link');
          appleIcon.rel = 'apple-touch-icon';
          appleIcon.href = '/apple-touch-icon-sindicato.png';
          document.head.appendChild(appleIcon);
          
          // Apple app title sindicato
          var appTitleMeta = document.createElement('meta');
          appTitleMeta.name = 'apple-mobile-web-app-title';
          appTitleMeta.content = 'Comerciários';
          document.head.appendChild(appTitleMeta);
          
          var appNameMeta = document.createElement('meta');
          appNameMeta.name = 'application-name';
          appNameMeta.content = 'Comerciários';
          document.head.appendChild(appNameMeta);
        } else {
          // --- ProSindWeb branding (padrão) ---
          var manifest = document.querySelector('link[rel="manifest"]');
          if (manifest) manifest.href = '/manifest-prosindweb.webmanifest?v=prosindweb-final-20260517c';

          var favicon = document.createElement('link');
          favicon.rel = 'icon';
          favicon.type = 'image/png';
          favicon.href = '/favicon.png?v=prosindweb-final-20260517c';
          document.head.appendChild(favicon);

          var shortcutIcon = document.createElement('link');
          shortcutIcon.rel = 'shortcut icon';
          shortcutIcon.href = '/favicon.ico?v=prosindweb-final-20260517c';
          document.head.appendChild(shortcutIcon);
          
          var appleIcon = document.createElement('link');
          appleIcon.rel = 'apple-touch-icon';
          appleIcon.href = '/prosindweb-apple-touch-icon.png?v=prosindweb-final-20260517c';
          document.head.appendChild(appleIcon);
          
          var appTitleMeta = document.createElement('meta');
          appTitleMeta.name = 'apple-mobile-web-app-title';
          appTitleMeta.content = 'Prosinge';
          document.head.appendChild(appTitleMeta);
          
          var appNameMeta = document.createElement('meta');
          appNameMeta.name = 'application-name';
          appNameMeta.content = 'Prosinge';
          document.head.appendChild(appNameMeta);
        }

    <!--
      Mantém sempre um único manifest estático. Isso evita que PWABuilder leia
      manifests antigos, gerados por blob ou injetados automaticamente.
    -->
    <script>
      (function() {
        var path = window.location.pathname;
        if (path.startsWith('/app') || path.startsWith('/sindicato')) {
          // Remove quaisquer manifests extras adicionados pelo vite-plugin-pwa.
          document.addEventListener('DOMContentLoaded', function() {
            var links = document.querySelectorAll('link[rel="manifest"]');
            for (var i = 1; i < links.length; i++) {
              links[i].parentNode && links[i].parentNode.removeChild(links[i]);
            }
          });
        }
      })();
    </script>

    <!-- Cache cleanup: força limpeza única no domínio ProsindWeb -->
    <script>
      (function() {
        try {
          var host = window.location.hostname;
          var isProsindWeb = host === 'prosindweb.com.br' || host === 'www.prosindweb.com.br';
          var FLAG = 'prosindweb-cache-cleared-20260520a';
          if (isProsindWeb && !localStorage.getItem(FLAG)) {
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                regs.forEach(function(r) { r.unregister(); });
              }).catch(function(){});
            }
            if (window.caches && caches.keys) {
              caches.keys().then(function(keys) {
                return Promise.all(keys.map(function(k) { return caches.delete(k); }));
              }).then(function() {
                localStorage.setItem(FLAG, '1');
                if (!sessionStorage.getItem(FLAG + '-reloaded')) {
                  sessionStorage.setItem(FLAG + '-reloaded', '1');
                  window.location.reload();
                }
              }).catch(function(){
                localStorage.setItem(FLAG, '1');
              });
            } else {
              localStorage.setItem(FLAG, '1');
            }
          }
        } catch (e) { /* noop */ }
      })();
    </script>
