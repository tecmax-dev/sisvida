<!doctype html>
<html lang="pt-BR">
   <head>
     <script>
       // Redirect /instalar as early as possible to bypass cache if it's the specific Play Store redirect
       (function() {
         // Log para debug
         console.log('[Redirect] Checking redirect for:', window.location.hostname, window.location.pathname);
         
         // Normalizamos o pathname para garantir que funcione com ou sem barra no final
          var path = window.location.pathname.replace(/\/$/, "");
          var domains = ["app.eclini.com.br", "www.app.eclini.com.br", "prosindweb.com.br", "www.prosindweb.com.br"];
          if (domains.indexOf(window.location.hostname) > -1 && (path === "/instalar" || path === "/app/instalar")) {
           var userAgent = window.navigator.userAgent.toLowerCase();
           console.log('[Redirect] Host and path match. UserAgent:', userAgent);
           
           if (userAgent.indexOf("android") > -1) {
             console.log('[Redirect] Android detected. Redirecting...');
             window.location.replace("https://play.google.com/store/apps/details?id=br.org.secmi.comerciariosilheus.app&hl=pt_BR");
           } else {
             console.log('[Redirect] Not an Android device.');
           }
         }
       })();
     </script>
     <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>ProsindWeb - Gestão Sindical e Clínica</title>
    <meta name="title" content="ProsindWeb - Gestão Sindical e Clínica" />
    <meta name="description" content="Sistema completo de gestão sindical e clínica. Agendamento online, prontuário eletrônico, controle financeiro." />
    <meta name="keywords" content="gestão sindical, gestão clínica, agendamento online, prontuário eletrônico, sistema para sindicatos" />
    <meta name="author" content="ProsindWeb" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://prosindweb.com.br" />
    
    <!-- PWA iOS meta tags base -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.json" />
    
    <!--
      Critérios para o Chrome Android mostrar o prompt de instalação (qualquer versão):
      1. ✅ manifest.json válido com name, icons (192px any + 512px maskable), start_url, display
      2. ✅ Service Worker registrado com fetch handler
      3. ✅ HTTPS
      4. ✅ Ícones servidos sem erro
      5. ✅ Chrome >= 119: screenshots recomendadas (adicionadas ao manifest)
      6. ✅ prefer_related_applications: false (ou ausente)
    -->
    <script>
      (function() {
        var path = window.location.pathname;
         var isSindicato = (path.startsWith('/app') || path.startsWith('/sindicato')) && 
                           window.location.hostname !== 'prosindweb.com.br' && 
                           window.location.hostname !== 'www.prosindweb.com.br';
        
        if (isSindicato) {
          // --- SECMI / Sindicato branding ---
          // Favicon sindicato
          var favicon = document.createElement('link');
          favicon.rel = 'icon';
          favicon.type = 'image/png';
          favicon.href = '/apple-touch-icon-sindicato.png';
          document.head.appendChild(favicon);
          
          // Apple touch icon sindicato
          var appleIcon = document.createElement('link');
          appleIcon.rel = 'apple-touch-icon';
          appleIcon.href = '/apple-touch-icon-sindicato.png';
          document.head.appendChild(appleIcon);
          
          // Apple app title sindicato
          var appTitleMeta = document.createElement('meta');
          appTitleMeta.name = 'apple-mobile-web-app-title';
          appTitleMeta.content = 'Comerciários';
          document.head.appendChild(appTitleMeta);
          
          var appNameMeta = document.createElement('meta');
          appNameMeta.name = 'application-name';
          appNameMeta.content = 'Comerciários';
          document.head.appendChild(appNameMeta);
        } else {
          // --- ProSindWeb branding (padrão) ---
          var favicon = document.createElement('link');
          favicon.rel = 'icon';
          favicon.type = 'image/png';
          favicon.href = '/favicon.png';
          document.head.appendChild(favicon);
          
          var appleIcon = document.createElement('link');
          appleIcon.rel = 'apple-touch-icon';
          appleIcon.href = '/favicon.png';
          document.head.appendChild(appleIcon);
          
          var appTitleMeta = document.createElement('meta');
          appTitleMeta.name = 'apple-mobile-web-app-title';
          appTitleMeta.content = 'ProsindWeb';
          document.head.appendChild(appTitleMeta);
          
          var appNameMeta = document.createElement('meta');
          appNameMeta.name = 'application-name';
          appNameMeta.content = 'ProsindWeb';
          document.head.appendChild(appNameMeta);
        }
      })();
    </script>
    
    <!--
      Mantém sempre um único manifest estático. Isso evita que PWABuilder leia
      manifests antigos, gerados por blob ou injetados automaticamente.
    -->
    <script>
      (function() {
        var path = window.location.pathname;
        if (path.startsWith('/app') || path.startsWith('/sindicato')) {
          // Remove quaisquer manifests extras adicionados pelo vite-plugin-pwa.
          document.addEventListener('DOMContentLoaded', function() {
            var links = document.querySelectorAll('link[rel="manifest"]');
            for (var i = 1; i < links.length; i++) {
              links[i].parentNode && links[i].parentNode.removeChild(links[i]);
            }
          });
        }
      })();
    </script>
